services:
  - type: web
    name: al-business-agent-api-albusiness
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: ALLOWED_ORIGINS
        value: https://al-business.github.io
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: al-business-agent-jobs
          property: connectionString
      - key: MAX_JOB_ATTEMPTS
        value: 3
      - key: JOB_LEASE_SECONDS
        value: 180
      - key: AI_MAX_TOKENS
        value: 900
      - key: AI_TIMEOUT_MS
        value: 60000

databases:
  - name: al-business-agent-jobs
    databaseName: al_business_agents
    user: al_business_agents
    plan: basic-256mb
    region: frankfurt
